<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Irene Ancilla Chow - Resume</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #07090e;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 20px;
        background: #0f141f;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-wrap: wrap;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        color: #f8fafc;
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: #f8fafc;
      }
      .btn-primary {
        background: #ffffff;
        color: #0f172a;
        border-color: #ffffff;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: #111827;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <span class="title">Irene Ancilla Chow - Curriculum Vitae (PDF)</span>
      <div class="actions">
        <a class="btn btn-primary" href="/resume.pdf" download="Irene-Ancilla-Chow-Resume.pdf">
          Download PDF
        </a>
      </div>
    </header>
    <iframe src="/resume.pdf" title="Irene Ancilla Chow Resume PDF"></iframe>
  </body>
</html>
